# Netlify Configuration for Profile Bot

[build]
  # The frontend is located in the frontend/ subfolder
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Fallback for Single Page Application routing (React)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
