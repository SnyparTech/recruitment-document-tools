<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snypar Resdex Bot</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 14px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .dot.offline { background: #ef4444; }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3b82f6; }
  </style>
</head>
<body>
  <h3>⚡ Snypar Resdex Bot</h3>
  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="status-text">Checking server...</span>
  </div>
  <p>Connected directly to your Naukri Launcher session. Auto-fills mandatory skills with stars ⭐, checkboxes, and active period.</p>
  <button id="fill-btn">⚡ Auto-Fill Resdex Form Now</button>
  <script src="popup.js"></script>
</body>
</html>
