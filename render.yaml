services:
  - type: web
    name: profile-bot
    env: python
    buildCommand: pip install -r backend/requirements.txt && playwright install --with-deps chromium
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: BROWSER_HEADLESS
        value: "true"
      - key: BROWSER_USER_DATA_DIR
        value: "/tmp/playwright-profile"
